name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            suffix: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            suffix: darwin-amd64
          - target: aarch64-apple-darwin
            runner: macos-15
            suffix: darwin-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            suffix: windows-amd64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            suffix: windows-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build --release --bin only --target ${{ matrix.target }} --locked
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename artifact (unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/only only-${{ matrix.suffix }}

      - name: Rename artifact (windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/only.exe only-${{ matrix.suffix }}.exe

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-bin
          path: only-${{ matrix.suffix }}

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-bin
          path: only-${{ matrix.suffix }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate release metadata
        run: |
          printf '%s\n' "${GITHUB_REF_NAME}" > VERSION
          sha256sum only-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            only-*
            VERSION
            SHA256SUMS
          generate_release_notes: true

  aur:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pkg: only-bin
            dir: packaging/arch/only-bin
          - pkg: only-git
            dir: packaging/arch/only-git
    steps:
      - uses: actions/checkout@v7

      - name: Update pkgver in PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "${{ matrix.dir }}/PKGBUILD"

      - name: Update sha256sums for only-bin
        if: matrix.pkg == 'only-bin'
        run: |
          curl -fsSL "${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/SHA256SUMS" -o SHA256SUMS
          SHA_X86_64="$(awk '$2 == "only-linux-amd64" {print $1}' SHA256SUMS)"
          SHA_AARCH64="$(awk '$2 == "only-linux-arm64" {print $1}' SHA256SUMS)"
          test -n "${SHA_X86_64}"
          test -n "${SHA_AARCH64}"
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_X86_64}')/" "${{ matrix.dir }}/PKGBUILD"
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_AARCH64}')/" "${{ matrix.dir }}/PKGBUILD"

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: ${{ matrix.dir }}/PKGBUILD
          commit_username: KercyDing
          commit_email: dkx215417@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
